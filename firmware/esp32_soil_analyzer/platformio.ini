; PlatformIO project for the Smart Soil Analyzer (ESP32 + RS485 7-in-1 probe).
; See ../README.md for wiring and register map.
[env:esp32dev]
platform = espressif32@^6.9.0
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 921600

; The probe needs 5 V and a stabilisation delay; the ESP32 is 3.3 V logic.
board_build.f_cpu = 240000000L
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -Wall
    -Wextra

lib_deps =
    bblanchon/ArduinoJson@^7.2.1
    emelianov/modbus-esp8266@^4.1.0

; Catch obvious mistakes at build time rather than in the field.
build_type = release
