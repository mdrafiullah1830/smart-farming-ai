<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="সবুজ ধানক্ষেতের সারি, সূর্য ও সেচ খালের কৃষি দৃশ্য">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f2b1e"/>
      <stop offset="0.45" stop-color="#123524"/>
      <stop offset="1" stop-color="#0d2018"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.78" cy="0.16" r="0.5">
      <stop offset="0" stop-color="#f6c453" stop-opacity="0.55"/>
      <stop offset="0.35" stop-color="#e6a23c" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#e6a23c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="field1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c5a3f"/>
      <stop offset="1" stop-color="#123d2d"/>
    </linearGradient>
    <linearGradient id="field2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#245f45"/>
      <stop offset="1" stop-color="#164631"/>
    </linearGradient>
    <linearGradient id="field3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f7a52"/>
      <stop offset="1" stop-color="#1b5238"/>
    </linearGradient>
    <linearGradient id="canal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f6f8f" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#1d4a60" stop-opacity="0.1"/>
    </linearGradient>
    <pattern id="paddy" width="34" height="26" patternUnits="userSpaceOnUse" patternTransform="skewX(-16)">
      <path d="M17 26V6" stroke="#b7d94c" stroke-opacity="0.16" stroke-width="1.6"/>
      <path d="M17 12l-6-4M17 12l6-4M17 19l-7-4M17 19l7-4" stroke="#b7d94c" stroke-opacity="0.12" stroke-width="1.2" fill="none"/>
    </pattern>
    <pattern id="grain" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.7" fill="#b7d94c" fill-opacity="0.05"/>
      <circle cx="6" cy="6" r="0.6" fill="#ffffff" fill-opacity="0.04"/>
    </pattern>
  </defs>

  <!-- sky + sun -->
  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#sun)"/>
  <circle cx="1250" cy="150" r="72" fill="#f6c453" fill-opacity="0.16"/>
  <circle cx="1250" cy="150" r="44" fill="#f6c453" fill-opacity="0.22"/>

  <!-- far horizon / tree line -->
  <path d="M0 372c90-16 180-24 300-14 120 10 200-6 320-2 130 4 220 22 340 16 140-7 260-26 420-14 60 5 140 12 220 22V430H0z" fill="#0a1a12"/>
  <g fill="#0e2519">
    <path d="M120 372c8-26 16-40 26-46 10 6 18 20 26 46z"/>
    <path d="M330 366c10-30 19-45 30-52 11 7 20 22 30 52z"/>
    <path d="M905 368c9-28 18-42 28-49 10 7 19 21 28 49z"/>
    <path d="M1180 374c8-24 16-36 24-42 9 6 16 18 24 42z"/>
  </g>

  <!-- paddy fields -->
  <path d="M0 430h1600v110H0z" fill="url(#field2)"/>
  <path d="M0 430h1600v110H0z" fill="url(#paddy)"/>
  <path d="M0 540h1600v150H0z" fill="url(#field1)"/>
  <path d="M0 540h1600v150H0z" fill="url(#paddy)" opacity="0.7"/>
  <path d="M0 690h1600v210H0z" fill="url(#field3)"/>
  <path d="M0 690h1600v210H0z" fill="url(#paddy)"/>

  <!-- field furrows -->
  <g stroke="#0b1d14" stroke-opacity="0.35" stroke-width="2">
    <path d="M0 470h1600M0 512h1600M0 596h1600M0 640h1600M0 754h1600M0 812h1600"/>
  </g>

  <!-- irrigation canal -->
  <path d="M0 655c180-26 330-30 470-14 150 18 250 46 410 40 140-6 300-34 460-14 90 11 180 24 260 38v56c-120-16-220-30-330-38-150-11-300 12-450 18-150 6-260-22-400-38-140-16-280-14-420 2z" fill="url(#canal)"/>
  <path d="M0 655c180-26 330-30 470-14 150 18 250 46 410 40 140-6 300-34 460-14" fill="none" stroke="#7fc8e8" stroke-opacity="0.18" stroke-width="2"/>

  <!-- foreground grain texture -->
  <rect width="1600" height="900" fill="url(#grain)"/>
</svg>
