name: smart_farming_ai
description: AI Smart Farming Platform for Bangladesh

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  provider: ^6.1.1

  # Network
  dio: ^5.4.0
  connectivity_plus: ^5.0.2

  # Local Storage
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # UI
  cupertino_icons: ^1.0.6
  flutter_svg: ^2.0.9
  google_fonts: ^6.1.0
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_staggered_animations: ^1.1.1
  percent_indicator: ^4.2.3
  fl_chart: ^0.66.0
  carousel_slider: ^4.2.1

  # Maps
  google_maps_flutter: ^2.5.3
  geolocator: ^10.1.0
  geocoding: ^2.1.1

  # Camera & Image
  image_picker: ^1.0.7
  camera: ^0.10.5+9

  # Location
  location: ^5.0.3

  # Permissions
  permission_handler: ^11.1.0

  # Firebase
  firebase_core: ^2.25.4
  firebase_messaging: ^14.7.15

  # Utils
  intl: ^0.20.2
  uuid: ^4.2.2
  path_provider: ^2.1.2
  url_launcher: ^6.2.2
  share_plus: ^7.2.1
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  hive_generator: ^2.0.1
  build_runner: ^2.4.8

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/translations/

  # fonts:
  #   - family: NotoSansBengali
  #     fonts:
  #       - asset: assets/fonts/NotoSansBengali-Regular.ttf
  #       - asset: assets/fonts/NotoSansBengali-Bold.ttf
  #         weight: 700
