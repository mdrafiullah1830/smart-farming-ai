<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" width="720" height="560" role="img" aria-labelledby="heroIllusTitle heroIllusDesc">
  <title id="heroIllusTitle">Smart Farming AI ড্যাশবোর্ড</title>
  <desc id="heroIllusDesc">সবুজ ধানক্ষেতের পাশে স্মার্ট ফার্মিং AI ড্যাশবোর্ডে মাটি, NPK, আবহাওয়া ও ফসল সুপারিশের তথ্য দেখানো হয়েছে।</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d231a"/>
      <stop offset="1" stop-color="#123125"/>
    </linearGradient>
    <linearGradient id="paddy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f855a"/>
      <stop offset="1" stop-color="#123d2d"/>
    </linearGradient>
    <linearGradient id="lime" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b7d94c"/>
      <stop offset="1" stop-color="#e6a23c"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
    <pattern id="rice" width="26" height="22" patternUnits="userSpaceOnUse" patternTransform="skewX(-14)">
      <path d="M13 22V6" stroke="#b7d94c" stroke-opacity="0.28" stroke-width="1.4"/>
      <path d="M13 11l-5-3.5M13 11l5-3.5M13 17l-6-3.5M13 17l6-3.5" stroke="#b7d94c" stroke-opacity="0.2" stroke-width="1.1" fill="none"/>
    </pattern>
  </defs>

  <rect width="720" height="560" rx="24" fill="url(#panel)"/>

  <!-- sun -->
  <circle cx="592" cy="92" r="46" fill="#e6a23c" fill-opacity="0.16"/>
  <circle cx="592" cy="92" r="28" fill="#e6a23c" fill-opacity="0.28"/>

  <!-- paddy field -->
  <path d="M0 372h720v188H0z" fill="url(#paddy)"/>
  <path d="M0 372h720v188H0z" fill="url(#rice)"/>
  <path d="M0 404h720M0 446h720M0 500h720" stroke="#0a1c14" stroke-opacity="0.4" stroke-width="2"/>

  <g fill="#0e2d20">
    <path d="M56 372c9-30 18-45 29-52 11 7 20 22 29 52z"/>
    <path d="M132 376c7-24 14-36 23-42 8 6 15 18 22 42z"/>
  </g>

  <!-- shelter / barn -->
  <g>
    <path d="M182 372v-58h96v58z" fill="#16432f"/>
    <path d="M170 316l60-40 60 40z" fill="#1d5b43"/>
    <rect x="216" y="330" width="28" height="42" rx="4" fill="#0d231a"/>
  </g>

  <!-- dashboard glass card -->
  <g>
    <rect x="330" y="54" width="356" height="300" rx="20" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.16"/>
    <rect x="352" y="78" width="30" height="30" rx="9" fill="#b7d94c" fill-opacity="0.9"/>
    <path d="M360 99l5-9 5 9z" fill="#123d2d"/>
    <rect x="394" y="84" width="132" height="10" rx="5" fill="#e8f2e6" fill-opacity="0.8"/>
    <rect x="394" y="100" width="84" height="8" rx="4" fill="#e8f2e6" fill-opacity="0.4"/>

    <!-- metric tiles -->
    <g>
      <rect x="352" y="128" width="152" height="66" rx="14" fill="#ffffff" fill-opacity="0.06"/>
      <rect x="366" y="142" width="46" height="9" rx="4.5" fill="#b7d94c" fill-opacity="0.85"/>
      <rect x="366" y="160" width="96" height="18" rx="6" fill="url(#lime)" fill-opacity="0.85"/>
      <rect x="366" y="184" width="62" height="6" rx="3" fill="#e8f2e6" fill-opacity="0.32"/>
    </g>
    <g>
      <rect x="516" y="128" width="152" height="66" rx="14" fill="#ffffff" fill-opacity="0.06"/>
      <rect x="530" y="142" width="38" height="9" rx="4.5" fill="#2f6f8f" fill-opacity="0.95"/>
      <rect x="530" y="160" width="78" height="18" rx="6" fill="#8ec6a1" fill-opacity="0.8"/>
      <rect x="530" y="184" width="54" height="6" rx="3" fill="#e8f2e6" fill-opacity="0.32"/>
    </g>

    <!-- NPK bar chart -->
    <g>
      <rect x="352" y="206" width="316" height="124" rx="14" fill="#ffffff" fill-opacity="0.05"/>
      <rect x="352" y="206" width="316" height="124" rx="14" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
      <g fill="#b7d94c" fill-opacity="0.85">
        <rect x="374" y="272" width="20" height="40" rx="5"/>
        <rect x="404" y="256" width="20" height="56" rx="5"/>
        <rect x="434" y="284" width="20" height="28" rx="5"/>
      </g>
      <g fill="#2f6f8f" fill-opacity="0.85">
        <rect x="474" y="252" width="20" height="60" rx="5"/>
        <rect x="504" y="268" width="20" height="44" rx="5"/>
        <rect x="534" y="240" width="20" height="72" rx="5"/>
      </g>
      <g fill="#e6a23c" fill-opacity="0.9">
        <rect x="584" y="266" width="20" height="46" rx="5"/>
        <rect x="614" y="246" width="20" height="66" rx="5"/>
      </g>
      <path d="M378 262l30-18 30 22 40-26 30 14 30-30 50 20 30-24" fill="none" stroke="#ccea8b" stroke-opacity="0.7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- yield rings (in-field overlay, bottom-left) -->
  <g>
    <rect x="40" y="300" width="196" height="86" rx="16" fill="#0d231a" fill-opacity="0.82" stroke="#ffffff" stroke-opacity="0.14"/>
    <circle cx="80" cy="343" r="22" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="6"/>
    <circle cx="80" cy="343" r="22" fill="none" stroke="#b7d94c" stroke-width="6" stroke-linecap="round" stroke-dasharray="104 138" transform="rotate(-90 80 343)"/>
    <rect x="118" y="330" width="96" height="10" rx="5" fill="#e8f2e6" fill-opacity="0.75"/>
    <rect x="118" y="348" width="66" height="8" rx="4" fill="#e8f2e6" fill-opacity="0.38"/>
  </g>
</svg>
