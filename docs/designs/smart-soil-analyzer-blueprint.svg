      .t{fill:#d8f4ff;font:16px Arial,sans-serif}.s{fill:#8fdcff;font:13px Arial,sans-serif}.n{fill:#fff;font:bold 22px Arial,sans-serif}.title{fill:#fff;font:bold 34px Arial,sans-serif;letter-spacing:2px}.sub{fill:#8fdcff;font:15px Arial,sans-serif;letter-spacing:1px}
    </style>
