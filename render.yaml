services:
  # ─── AI Inference Service ────────────────────────────────────────────
  - type: web
    name: smart-farming-ai-service
    runtime: docker
    plan: free
    dockerfilePath: ./apps/ai-service/Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: SERVICE_TOKEN
        sync: false
      - key: APP_ENV
        value: production
      - key: MODEL_PATH
        value: /app/models/disease_model.onnx
      # Render injects PORT; the image CMD reads ${PORT:-10000}.
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: HF_HOME
        value: /tmp/hf
      - key: TRANSFORMERS_CACHE
        value: /tmp/hf
      - key: SENTENCE_TRANSFORMERS_HOME
        value: /tmp/hf

  # ─── Python Backend API ──────────────────────────────────────────────
  - type: web
    name: smart-farming-ai-backend
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /api/v1/health
    autoDeployTrigger: commit
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: APP_ENV
        value: production
      - key: PYTHONUNBUFFERED
        value: "1"
      # Browser origins that may call this API directly. The production site
      # is served by Vercel and reaches the Cloudflare Worker, so this list
      # only needs the service hostnames plus local development.
      - key: CORS_ORIGINS
        value: https://smart-farming-ai-service.onrender.com,https://smart-farming-ai-backend.onrender.com,https://smart-farming-ai.onrender.com,http://localhost:3000
