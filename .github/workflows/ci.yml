name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  worker:
    name: Worker API (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/worker-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/worker-api/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck

  ai-service:
    name: AI Service (FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/ai-service/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  ai-service-build:
    name: AI Service (Docker build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (no push)
        run: docker build -t smart-farming-ai-svc apps/ai-service

  python-syntax:
    name: Python syntax (ai_models, backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m compileall -q apps/ai-service/app ai_models
      - run: python -m py_compile backend/main.py

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
