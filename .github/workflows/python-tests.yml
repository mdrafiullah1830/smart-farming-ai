name: Python Tests & Lint

on:
  push:
    branches: [main]
    paths:
      - '**.py'
      - 'pyproject.toml'
      - 'ruff.toml'
      - 'apps/ai-service/**'
      - 'backend/**'
      - 'ai_models/**'
      - 'scripts/**'
      - 'tests/**'
      - 'requirements*.txt'
      - '.github/workflows/python-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - '**.py'
      - 'pyproject.toml'
      - 'ruff.toml'
      - 'apps/ai-service/**'
      - 'backend/**'
      - 'ai_models/**'
      - 'scripts/**'
      - 'tests/**'
      - 'requirements*.txt'
      - '.github/workflows/python-tests.yml'

env:
  # Pinned so a new rule set can never turn main red without a deliberate bump.
  RUFF_VERSION: '0.16.6'
  MYPY_VERSION: '2.3.1'
  BANDIT_VERSION: '1.9.4'
  PIP_AUDIT_VERSION: '2.10.1'

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ruff
        run: pip install "ruff==${RUFF_VERSION}"
      - name: Run ruff check (deployable AI service only)
        run: ruff check apps/ai-service/app
      - name: Run ruff format check (deployable AI service only)
        run: ruff format --check apps/ai-service/app

  type-check:
    name: Type Check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install mypy
        run: pip install "mypy==${MYPY_VERSION}"
      - name: Run mypy
        run: mypy apps/ai-service/app ai_models backend scripts --ignore-missing-imports

  test-ai-service:
    name: AI Service Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ai-service
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: apps/ai-service/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run pytest
        run: pytest tests/ -v --tb=short

  test-backend:
    name: Backend API Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements-api.txt
      - name: Install dependencies
        run: |
          pip install -r backend/requirements-api.txt
          pip install pytest
      - name: Run pytest
        # The suite lives in tests/backend (see pyproject testpaths), not in
        # backend/tests — running from backend/ silently skipped every test.
        run: pytest tests/backend -v --tb=short

  test-training:
    name: Training Scripts Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax check training scripts
        # py_compile only parses — no torch/tensorflow install needed.
        run: |
          python -m py_compile ai_models/disease_detection/train.py
          python -m py_compile ai_models/disease_detection/train_pytorch_onnx.py
          python -m py_compile ai_models/crop_prediction/train.py
          python -m py_compile ai_models/yield_prediction/train.py
          python -m py_compile ai_models/market_forecasting/train.py
          python -m py_compile ai_models/chatbot/train.py

  security:
    name: Security Scan (bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bandit
        run: pip install "bandit==${BANDIT_VERSION}"
      - name: Run bandit
        # Run from the repo root: scripts/.bandit resolves configfile relative
        # to the working directory.
        run: bandit -r apps/ai-service/app ai_models backend scripts -ll -x tests

  dependencies:
    name: Dependency Check (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pip-audit
        run: pip install "pip-audit==${PIP_AUDIT_VERSION}"
      - name: Audit AI Service deps
        run: pip-audit -r apps/ai-service/requirements.txt
      - name: Audit Backend API deps
        # This is the file backend/Dockerfile actually installs on Render.
        run: pip-audit -r backend/requirements-api.txt
      - name: Audit legacy ML requirements (advisory only)
        # backend/requirements.txt is the retired full ML stack; it is not
        # deployed, so advisories there are reported but never blocking.
        run: pip-audit -r backend/requirements.txt || true

concurrency:
  group: python-${{ github.ref }}
  cancel-in-progress: true
