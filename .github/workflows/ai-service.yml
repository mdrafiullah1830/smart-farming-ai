name: AI Service CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - 'apps/ai-service/**'
      - 'scripts/export_models_to_onnx.py'
      - 'pyproject.toml'
      - '.github/workflows/ai-service.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/ai-service/**'
      - 'scripts/export_models_to_onnx.py'
      - 'pyproject.toml'
      - '.github/workflows/ai-service.yml'
  # Publishing to GHCR needs `packages: write`, which org policy can withhold
  # from the default GITHUB_TOKEN. Keep it an explicit, permissioned action so
  # the automatic pipeline can never fail on registry permissions.
  workflow_dispatch:
    inputs:
      push_image:
        description: 'Push the image to ghcr.io'
        type: boolean
        default: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/ai-service
  RUFF_VERSION: '0.16.6'

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install "ruff==${RUFF_VERSION}"

      - name: Run Ruff linting (deployable app)
        run: ruff check apps/ai-service/app

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: apps/ai-service/requirements-dev.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r apps/ai-service/requirements-dev.txt

      - name: Run pytest
        run: pytest apps/ai-service/tests -v --tb=short
        env:
          SERVICE_TOKEN: test-token
          MODEL_PATH: /nonexistent/model.onnx
          MODELS_DIR: apps/ai-service/models
          METADATA_DIR: apps/ai-service/models

  build-docker:
    name: Build Docker Image
    needs: [test]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image (validation only)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/ai-service/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-image:
    name: Publish Docker Image
    needs: [build-docker]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    if: github.event_name == 'workflow_dispatch' && inputs.push_image
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/ai-service/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy to Staging
    needs: build-docker
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: staging
    steps:
      - name: Deploy to Azure Container Apps (Staging)
        run: |
          echo "Deploy to staging environment"
          # az containerapp update --name smart-farming-ai-staging --resource-group rg-smart-farming --image ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}

  deploy-production:
    name: Deploy to Production
    needs: deploy-staging
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Deploy to Azure Container Apps (Production)
        run: |
          echo "Deploy to production environment"
          # az containerapp update --name smart-farming-ai-prod --resource-group rg-smart-farming --image ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
