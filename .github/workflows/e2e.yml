name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright (root, where config + tests live)
        run: |
          npm init -y
          npm install -D @playwright/test serve
          npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: |
          npx playwright test tests/e2e.spec.ts --project=chromium --reporter=github
        env:
          E2E_BASE_URL: http://localhost:3000
          E2E_API_BASE: ${{ secrets.E2E_API_BASE }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  e2e-api:
    name: API Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright (root, where config + tests live)
        run: |
          npm init -y
          npm install -D @playwright/test
          npx playwright install --with-deps chromium

      - name: Run API tests against deployed Worker
        continue-on-error: true
        run: |
          npx playwright test tests/e2e.spec.ts --project=chromium --grep="API Integration" --reporter=github
        env:
          E2E_BASE_URL: https://smart-farming-ai-bice.vercel.app
          E2E_API_BASE: https://smart-farming-api.mdrafiullah1830.workers.dev