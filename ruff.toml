# ruff.toml — standalone config (no [tool.ruff] header)
# Line length matching Black
line-length = 100
target-version = "py312"

# Enable/disable rules
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "T20", # flake8-print
    "PTH", # flake8-use-pathlib
    "ERA", # eradicate
    "PL",  # pylint
    "TRY", # tryceratops
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
    "RET", # flake8-return
    "TID", # flake8-tidy-imports
]

ignore = [
    "E501",  # line too long (handled by Black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex (allow for ML training scripts)
    "T201",  # print statement (allow in training scripts)
    "ARG001", # unused argument (allow in callback signatures)
    "ARG002", # unused method argument
]

# Per-file ignores
[lint.per-file-ignores]
"tests/*" = ["S101", "T201"]  # allow assert and print in tests
"ai_models/*/train.py" = ["C901", "T201", "B008"]  # training scripts
"scripts/*.py" = ["T201"]  # scripts

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[lint.isort]
known-first-party = ["apps", "ai_models", "backend", "scripts", "tests"]
combine-as-imports = true

[lint.pydocstyle]
convention = "google"

[lint.flake8-tidy-imports]
ban-relative-imports = "all"

[lint.mccabe]
max-complexity = 15