# ruff.toml — standalone config (no [tool.ruff] header)
# Line length matching Black
line-length = 100
target-version = "py312"

[lint]
# Enable/disable rules
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "T20", # flake8-print
    "PTH", # flake8-use-pathlib
    "ERA", # eradicate
    "PL",  # pylint
    "TRY", # tryceratops
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
    "RET", # flake8-return
    "TID", # flake8-tidy-imports
]

ignore = [
    "E501",  # line too long (handled by Black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex (allow for ML training scripts)
    "T201",  # print statement (allow in training scripts)
    "ARG001", # unused argument (allow in callback signatures)
    "ARG002", # unused method argument
]

# Per-file ignores
[lint.per-file-ignores]
"tests/*" = ["S101", "T201"]  # allow assert and print in tests
"ai_models/*/train.py" = ["C901", "T201", "B008"]  # training scripts
"scripts/*.py" = ["T201"]  # scripts
# The AI service deliberately keeps imports function-local for two reasons:
#   * PLC0415 — heavy optional deps (faiss, sentence-transformers/torch,
#     langchain, Pillow) are imported at first use so the Render free-tier
#     cold start never pays for them, and `from app.main import
#     require_service_token` inside route handlers is what breaks the
#     app.main <-> app.routers import cycle (a module-level import would be
#     circular).
#   * PLW0603 — the `global` statements are lazy-init singletons: one ONNX
#     session/model per router plus JSON fare/cost tables loaded exactly once
#     on first use. The module-level name is the cache; refactoring it into a
#     mutable holder would only rename the same pattern.
"apps/ai-service/**" = ["PLC0415", "PLW0603"]

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[lint.isort]
known-first-party = ["apps", "ai_models", "backend", "scripts", "tests"]
combine-as-imports = true

[lint.pydocstyle]
convention = "google"

[lint.flake8-tidy-imports]
# Only parent-relative imports (`from ..pkg import x`) are banned: they reach
# outside the current package and break when files move. Single-dot imports
# (`from .embedder import TravelEmbedder`) are the idiomatic way to reference a
# sibling module inside `app.routers`, `app.travel.calculator` and
# `app.travel.rag`, and this tree contains no `from ..` imports at all.
ban-relative-imports = "parents"

[lint.mccabe]
max-complexity = 15
