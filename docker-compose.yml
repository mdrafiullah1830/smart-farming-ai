version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: smart_farming_postgres
    environment:
      POSTGRES_USER: smartfarming
      POSTGRES_PASSWORD: password
      POSTGRES_DB: smart_farming_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartfarming -d smart_farming_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mongodb:
    image: mongo:7
    container_name: smart_farming_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    profiles: ["full"]   # not used by the deployed surface; only for the deprecated backend/app/
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: smart_farming_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smart_farming_backend
    environment:
      - DATABASE_URL=postgresql+asyncpg://smartfarming:password@postgres:5432/smart_farming_db
      - REDIS_URL=redis://redis:6379/0
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY}
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY}
      - APP_ENV=production
      - DEBUG=false
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_started
      redis:
        condition: service_started
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: smart_farming_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  mongo_data:
  redis_data:
  uploads_data:
