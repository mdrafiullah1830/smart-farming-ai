[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-farming-ai"
version = "1.1.0"
description = "AI-powered agriculture platform for Bangladesh"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Academic"}
authors = [
    {name = "Smart Farming AI Team"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.14",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "black>=24.0",
    "isort>=5.13",
    "mypy>=1.10",
    "pre-commit>=3.8",
]
worker = [
    # Worker uses TypeScript, not Python
]
ai-service = [
    "fastapi>=0.116",
    "uvicorn[standard]>=0.35",
    "pydantic>=2.11",
    "onnxruntime>=1.28",
    "Pillow>=10.4",
    "numpy>=1.26",
    "httpx>=0.28",
]
backend = [
    "fastapi>=0.109",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.1",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0",
    "alembic>=1.13",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "psycopg2-binary>=2.9",
    "redis>=5.0",
    "httpx>=0.27",
    "aiofiles>=23.2",
    "Pillow>=10.2",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "tensorflow>=2.16",
    "torch>=2.2",
    "transformers>=4.37",
    "openai-whisper>=20231117",
    "google-cloud-storage>=2.14",
    "python-dateutil>=2.8",
    "pytz>=2024.1",
    "croniter>=2.0",
    "geopy>=2.4",
    "shapely>=2.0",
    "openpyxl>=3.1",
    "jinja2>=3.1",
    "websockets>=12.0",
    "orjson>=3.9",
    "tenacity>=8.2",
    "structlog>=24.1",
    "prometheus-client>=0.20",
    "sentry-sdk[fastapi]>=1.40",
    "bcrypt>=4.1",
]
training = [
    "torch>=2.2",
    "torchvision>=0.17",
    "tensorflow>=2.16",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "Pillow>=10.4",
    "onnx>=1.16",
    "onnxruntime>=1.28",
    "tf2onnx>=1.16",
]
frontend = [
    # Frontend uses Node.js
]

[tool.setuptools.packages.find]
where = ["."]
include = ["apps/*", "ai_models/*", "backend/*", "scripts/*", "tests/*"]

[tool.pytest.ini_options]
testpaths = ["tests", "apps/ai-service/tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
implicit_reexport = true
strict_equality = true
namespace_packages = true
explicit_package_bases = true
ignore_missing_imports = true
follow_imports = "silent"
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = ["apps.worker-api.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["ai_models.*"]
ignore_missing_imports = true

[tool.black]
line-length = 100
target-version = ["py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
  \.git
  | \.venv
  | node_modules
  | __pycache__
  | datasets/crop_disease_images
  | ai_models/trained_models
  | report_build
  | tmp
  | output
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
known_first_party = ["apps", "ai_models", "backend", "scripts", "tests"]
skip = [".git", ".venv", "node_modules", "__pycache__", "datasets", "ai_models/trained_models", "report_build", "tmp", "output"]

[tool.coverage.run]
source = ["apps", "ai_models", "backend", "scripts"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*_test.py",
    "*/__pycache__/*",
    "*/.venv/*",
    "*/node_modules/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
show_missing = true
skip_covered = true

[tool.bandit]
exclude_dirs = ["tests", ".venv", "node_modules", "datasets", "ai_models/trained_models"]
skips = ["B101", "B601"]